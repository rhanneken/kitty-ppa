name: Package and upload kitty to PPA

on:
  schedule:
    - cron: '48 2 * * *'   # 2:48am daily
      timezone: 'America/New_York'
  workflow_dispatch:
    inputs:
      kitty_version:
        description: 'kitty version to package (blank = use latest)'
        required: false
      ppa_revision:
        description: 'PPA revision suffix (e.g. ppa1)'
        required: false
        default: 'ppa1'

concurrency:
  group: release
  cancel-in-progress: false

env:
  GPG_KEY_ID: 2722591F921E292C948419835A34B1A5CFB6BF30

jobs:
  check-and-upload:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Read tracked version
        id: tracked
        run: echo "version=$(cat last-uploaded-version)" >> "$GITHUB_OUTPUT"

      - name: Get latest kitty release
        id: latest
        run: |
          if [ -n "${{ inputs.kitty_version }}" ]; then
            VERSION="${{ inputs.kitty_version }}"
          else
            VERSION=$(curl -fsSL \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              https://api.github.com/repos/kovidgoyal/kitty/releases/latest \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'].lstrip('v'))")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Latest kitty release: $VERSION"

      - name: Check if upload is needed
        id: check
        run: |
          LATEST="${{ steps.latest.outputs.version }}"
          TRACKED="${{ steps.tracked.outputs.version }}"
          if [ -n "${{ inputs.kitty_version }}" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: packaging kitty $LATEST as ${{ inputs.ppa_revision || 'ppa1' }}"
          elif [ "$LATEST" = "$TRACKED" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "kitty $LATEST is already tracked. Nothing to do."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "New version detected: $LATEST (tracked: $TRACKED)"
          fi

      - name: Install packaging tools
        if: steps.check.outputs.needed == 'true'
        run: |
          sudo add-apt-repository -y ppa:longsleep/golang-backports
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            devscripts debhelper dput curl gnupg golang-1.26-go

      - name: Import GPG key
        if: steps.check.outputs.needed == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
          echo "${GPG_KEY_ID}:6:" | gpg --import-ownertrust

          # Allow loopback pinentry and passphrase presetting for non-interactive signing
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          printf 'allow-loopback-pinentry\nallow-preset-passphrase\n' \
            > ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent
          gpg-connect-agent /bye

          # Pre-cache the passphrase so debuild can sign without prompting
          KEY_GRIP=$(gpg --with-keygrip --list-secret-keys "$GPG_KEY_ID" \
            | awk '/Keygrip/{print $3; exit}')
          echo "$GPG_PASSPHRASE" \
            | /usr/lib/gnupg2/gpg-preset-passphrase --preset "$KEY_GRIP"

      - name: Package and upload
        if: steps.check.outputs.needed == 'true'
        env:
          KITTY_VERSION: ${{ steps.latest.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PPA_REVISION: ${{ inputs.ppa_revision || 'ppa1' }}
        run: |
          export PATH="/usr/lib/go-1.26/bin:$PATH"
          bash scripts/package.sh

      - name: Update tracked version
        if: steps.check.outputs.needed == 'true' && inputs.kitty_version == ''
        env:
          KITTY_VERSION: ${{ steps.latest.outputs.version }}
        run: |
          echo "$KITTY_VERSION" > last-uploaded-version
          git config user.email "rhanneken@pobox.com"
          git config user.name "kitty-ppa bot"
          git add last-uploaded-version
          git commit -m "Track kitty ${KITTY_VERSION}"
          git push
